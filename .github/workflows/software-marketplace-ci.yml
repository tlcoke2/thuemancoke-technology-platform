name: TCL software marketplace gated candidate checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/software-marketplace-ci.yml'
  push:
    branches: [feature/software-marketplace-and-epr-registration-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: tcl_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tcl_store_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tcl_test -d tcl_store_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TCL_TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://tcl_test:synthetic-ci-only@127.0.0.1:5432/tcl_store_test' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend runtime and isolated test client
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1"
      - name: Parse source
        run: python -m compileall -q app tests
      - name: Run isolated synthetic registration tests
        run: python -m unittest discover -s tests -v
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reproducible install
        run: npm ci
      - name: Build public website including software page
        run: npm run build
      - name: Assert published static page contains no public release URL
        run: |
          test -f dist/software.html
          ! grep -Ei 'TEC-EPR-Clinic-Edition-1\.0\.0-.*\.tar\.gz|private\.pem' dist/software.html
      - name: Verify staging cannot fall back to production intake
        run: |
          if npm run build -- --mode staging; then exit 1; fi
          if VITE_SOFTWARE_API_URL=https://api.thuemancokelimited.com npm run build -- --mode staging; then exit 1; fi
          VITE_SOFTWARE_API_URL=https://staging-api.example.com npm run build -- --mode staging
          grep -q 'https://staging-api.example.com' dist/software-config.js
          ! grep -R -q 'https://api.thuemancokelimited.com' dist
