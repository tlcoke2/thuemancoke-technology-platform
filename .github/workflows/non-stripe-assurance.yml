name: Non-Stripe assurance tools
on:
  pull_request:
    paths:
      - 'scripts/assurance/**'
      - 'tests/assurance/**'
      - '.github/workflows/non-stripe-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assurance-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests/assurance -v
      - run: node --test tests/assurance/licence-worker.test.cjs
