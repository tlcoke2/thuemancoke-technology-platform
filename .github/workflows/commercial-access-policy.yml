name: Commercial download authorization policy
on:
  pull_request:
    paths: ['commercial_core/**', '.github/workflows/commercial-access-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s commercial_core/tests -v
